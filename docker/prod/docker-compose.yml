version: "3.8"

services:
  mcp:
    image: nicolasst22/chatbot-toy-mcp:1.0-arm64
    networks:
      - chatbot
    ports:
      - 8001:8001
    restart: always
  
  bot:
    image: nicolasst22/chatbot-toy:1.0-arm64
    networks:
      - chatbot
    ports:
      - 8080:8000
    env_file:
      - ~/chatbot-toy/.env
    environment:
    - MCP_SERVER_URL=http://mcp:8001/mcp
    depends_on:
      - mcp
    restart: always

networks:
  chatbot: